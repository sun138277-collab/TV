name: Build APK
on:
  push:
    branches: [ fongmi ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install SDK Platform 37
        run: |
          yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" || true
      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "storeFile=debug.keystore" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "keyAlias=androiddebugkey" >> local.properties
          echo "keyPassword=android" >> local.properties
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Debug-APK
          path: app/build/outputs/apk/debug/*.apkname: Build APK
on:
  push:
    branches: [ fongmi ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Release-APK
          path: app/build/outputs/apk/release/*.apk
